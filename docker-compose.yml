services:
  titra:
    image: titraio/titra
    container_name: titra_app
    depends_on:
      - mongodb
    environment:
      - ROOT_URL=${ROOT_URL}
      - MONGO_URL=mongodb://mongodb/titra?directConnection=true
      - PORT=3000
      - TITRA_OAUTH_SECRET_KEY=${TITRA_OAUTH_SECRET_KEY:-}
      - TITRA_PRIVATE_INTEGRATION_HOSTS=${TITRA_PRIVATE_INTEGRATION_HOSTS:-}
      - TITRA_ALLOW_LOOPBACK_HTTP_INTEGRATIONS=${TITRA_ALLOW_LOOPBACK_HTTP_INTEGRATIONS:-}
      - TITRA_OIDC_ALLOW_INSECURE_LOOPBACK=${TITRA_OIDC_ALLOW_INSECURE_LOOPBACK:-}
      - TITRA_OIDC_ALLOW_VERIFIED_EMAIL_LINKING=${TITRA_OIDC_ALLOW_VERIFIED_EMAIL_LINKING:-}
      - TITRA_ENABLE_UNSAFE_LEGACY_SCRIPTS=${TITRA_ENABLE_UNSAFE_LEGACY_SCRIPTS:-}
      - TITRA_ENABLE_HSTS=${TITRA_ENABLE_HSTS:-}
      - TITRA_OPENAI_MODEL=${TITRA_OPENAI_MODEL:-}
      - TITRA_ENABLE_FIRST_USER_ADMIN=${TITRA_ENABLE_FIRST_USER_ADMIN:-}
      - TITRA_ENABLE_ADMIN_RECOVERY=${TITRA_ENABLE_ADMIN_RECOVERY:-}
    ports:
      - "3000:3000"
    restart: always
  mongodb:
    image: mongo:7.0.40@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: titra_db
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=titra
    volumes:
      - titra_db_volume:/data/db
volumes:
  titra_db_volume:
