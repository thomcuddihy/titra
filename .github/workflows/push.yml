name: Test and publish Docker image

on:
  push:
    branches:
      - master

# Every job declares only the permissions it needs.
permissions: {}

concurrency:
  group: titra-docker-release-master
  cancel-in-progress: false

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$/.test(version) ||
              /^(latest|unknown|uncommitted|default)$/i.test(version)) {
            throw new Error('package.json contains an unsafe release version');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  publish:
    name: Build once and publish the admitted manifest
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to Docker Hub for kromit
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kromit/titra:${{ needs.test.outputs.version }}
            kromit/titra:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Require an immutable build digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Sign in to Docker Hub for titraio
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_TITRAIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_TITRAIO }}

      - name: Copy the admitted manifest without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.test.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "titraio/titra:${VERSION}" \
            --tag titraio/titra:latest \
            "kromit/titra@${IMAGE_DIGEST}"

      - name: Verify every published tag resolves to the admitted manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.test.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_digest() {
            docker buildx imagetools inspect --raw "$1" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          }
          for image_ref in \
            "kromit/titra:${VERSION}" \
            kromit/titra:latest \
            "titraio/titra:${VERSION}" \
            titraio/titra:latest
          do
            actual_digest=$(manifest_digest "$image_ref")
            if [[ "$actual_digest" != "$IMAGE_DIGEST" ]]; then
              printf 'ERROR: %s resolved to %s, expected %s\n' \
                "$image_ref" "$actual_digest" "$IMAGE_DIGEST" >&2
              exit 1
            fi
          done

  release:
    name: Publish GitHub release
    needs:
      - test
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Write release notes without shell interpolation
        env:
          RELEASE_BODY: ${{ github.event.head_commit.message }}
        shell: bash
        run: printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the release for the published commit
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
