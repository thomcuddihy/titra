# Deprecated for production: Watchtower follows mutable tags and holds the
# Docker socket. Use a digest-pinned image and a controlled upgrade instead.
# This file remains only for backward-compatible local setups.
services:
  titra:
    image: titraio/titra
    container_name: titra_app
    depends_on:
      - mongodb
    environment:
      - ROOT_URL=${ROOT_URL}
      - MONGO_URL=mongodb://mongodb/titra?directConnection=true
      - PORT=3000
    ports:
      - "3000:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
  mongodb:
    image: mongo:7.0.40
    container_name: titra_db
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=titra
    volumes:
      - titra_db_volume:/data/db
  watchtower:
    image: nickfedor/watchtower
    profiles:
      - unsafe-auto-update
    container_name: watchtower
    restart: always
    command: --cleanup --schedule "0 0 0 * * *" --label-enable
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock
volumes:
  titra_db_volume:
    
